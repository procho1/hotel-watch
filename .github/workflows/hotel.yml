name: hotel-watch
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hotel-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          HEADLESS: "1"
          EVENT: ${{ github.event_name }}
        run: |
          git config user.name "hotel-bot"
          git config user.email "bot@users.noreply.github.com"
          END=$(( $(date +%s) + 5 * 3600 ))
          FIRST=1
          while true; do
            ARGS="--once"
            if [ "$FIRST" = "1" ] && [ "$EVENT" = "workflow_dispatch" ]; then ARGS="--once --ping"; fi
            FIRST=0
            python hotel_watch-2-2-2.py $ARGS || true
            git add seen.json
            if ! git diff --cached --quiet; then
              git commit -q -m "update seen"
              git pull -q --rebase || true
              git push -q || true
            fi
            WAIT=$(( $(python hotel_watch-2-2-2.py --next-wait) * 60 ))
            LEFT=$(( END - $(date +%s) ))
            if [ "$LEFT" -le "$WAIT" ]; then break; fi
            sleep "$WAIT"
          done
